<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTech - Smart Crop Recommender</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-green: #2ea043;
            --accent-blue: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        nav {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        nav a {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-block;
            background-color: rgba(46, 160, 67, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        select {
            background: #0d1117;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2ea043;
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <main class="container">
        <nav>
            <a href="index.html" style="font-weight: 700; color: var(--text-primary);">Recommendation Tool</a>
            <a href="about.html">About Model</a>
            <a href="pipeline.html">DevOps Pipeline</a>
        </nav>

        <span class="badge">AgriTech Intelligent Advisor</span>
        <h1>Smart Crop Recommendation System</h1>
        <p class="subtitle">Select your soil type and local seasonal parameters to determine suitable crops.</p>

        <form id="cropForm">
            <div class="form-grid">
                <div class="input-group">
                    <label for="soil">Soil Type</label>
                    <select id="soil" required>
                        <option value="alluvial">Alluvial Soil</option>
                        <option value="black">Black / Regur Soil</option>
                        <option value="red">Red / Sandy Soil</option>
                        <option value="clayey">Clayey Soil</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="season">Cropping Season</label>
                    <select id="season" required>
                        <option value="kharif">Kharif (Monsoon)</option>
                        <option value="rabi">Rabi (Winter)</option>
                        <option value="zaid">Zaid (Summer)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="water">Rainfall / Water Level</label>
                    <select id="water" required>
                        <option value="high">High (> 100 cm)</option>
                        <option value="moderate">Moderate (50 - 100 cm)</option>
                        <option value="low">Low (< 50 cm)</option>
                    </select>
                </div>
            </div>

            <button type="submit">Recommend Optimal Crops</button>
        </form>

        <div id="resultBox" class="result-box">
            <div id="cropName" class="result-title"></div>
            <div id="cropInfo" class="result-desc"></div>
        </div>
    </main>

    <script>
        document.getElementById('cropForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const soil = document.getElementById('soil').value;
            const season = document.getElementById('season').value;
            const water = document.getElementById('water').value;

            let crop = "Millets / Pulses";
            let tips = "Requires minimal water, resilient in varying soil qualities.";

            if (soil === 'alluvial' && water === 'high') {
                crop = "Rice (Paddy) or Sugarcane";
                tips = "Alluvial soil paired with heavy rainfall or consistent irrigation yields optimal growth for water-intensive staple crops.";
            } else if (soil === 'black') {
                crop = "Cotton or Soybean";
                tips = "Black soil has exceptional moisture retention, making it well-suited for cash crops like Cotton and Oilseeds.";
            } else if (season === 'rabi') {
                crop = "Wheat, Mustard, or Chickpeas";
                tips = "Winter conditions with moderate moisture levels provide the ideal temperature range for cereal and pulse maturation.";
            } else if (season === 'zaid') {
                crop = "Watermelon, Cucumber, or Fodder Crops";
                tips = "Short-duration summer crops thrive in warm, dry weather under controlled light watering.";
            } else if (water === 'low') {
                crop = "Jowar, Bajra, or Groundnut";
                tips = "Drought-resistant crops that perform reliably in sandy or shallow red soil under scarce rainfall conditions.";
            }

            document.getElementById('cropName').innerText = "Recommended Crop: " + crop;
            document.getElementById('cropInfo').innerText = tips;
            document.getElementById('resultBox').style.display = "block";
        });
    </script>

</body>
</html>
